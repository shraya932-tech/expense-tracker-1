<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111827">
    <title>Log In</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #182230;
            background: #f3f5fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            place-items: center;
            background:
                radial-gradient(ellipse at 12% 8%, #e0e7ff 0, transparent 38%),
                radial-gradient(ellipse at 90% 92%, #dbeafe 0, transparent 34%),
                #f7f8fc;
        }

        .login-card {
            width: min(100%, 430px);
            padding: clamp(28px, 7vw, 48px);
            border: 1px solid #e8ebf3;
            border-radius: 22px;
            background: #fff;
            box-shadow: 0 24px 70px rgb(25 36 66 / 12%);
        }

        .brand-mark {
            display: grid;
            width: 48px;
            height: 48px;
            margin-bottom: 28px;
            border-radius: 15px;
            color: #fff;
            background: linear-gradient(135deg, #6558e8, #4338ca);
            font-size: 22px;
            font-weight: 750;
            place-items: center;
        }

        h1 {
            margin: 0;
            font-size: clamp(28px, 6vw, 34px);
            letter-spacing: -0.04em;
        }

        .subtitle {
            margin: 10px 0 30px;
            color: #697386;
            line-height: 1.55;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            color: #354052;
            font-size: 14px;
            font-weight: 650;
        }

        input {
            width: 100%;
            min-height: 50px;
            padding: 0 14px;
            border: 1px solid #d9deea;
            border-radius: 10px;
            outline: none;
            background: #fff;
            color: #182230;
            font: inherit;
            transition: border-color 150ms ease, box-shadow 150ms ease;
        }

        input::placeholder {
            color: #9aa3b2;
        }

        input:focus {
            border-color: #6558e8;
            box-shadow: 0 0 0 4px rgb(101 88 232 / 13%);
        }

        button,
        .signup-link {
            display: flex;
            width: 100%;
            min-height: 50px;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font: inherit;
            font-weight: 700;
            text-decoration: none;
            transition: transform 150ms ease, background 150ms ease;
        }

        button {
            margin-top: 26px;
            border: 0;
            color: #fff;
            background: #5145d8;
            cursor: pointer;
        }

        button:hover:not(:disabled) {
            background: #4338ca;
            transform: translateY(-1px);
        }

        button:disabled {
            cursor: wait;
            opacity: 0.7;
        }

        .message {
            min-height: 24px;
            margin: 14px 0 0;
            color: #b42318;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.success {
            color: #067647;
        }

        .signup-prompt {
            margin: 24px 0 12px;
            color: #697386;
            font-size: 14px;
            text-align: center;
        }

        .signup-link {
            min-height: 46px;
            border: 1px solid #d9deea;
            color: #4338ca;
            background: #fff;
        }

        .signup-link:hover {
            background: #f7f6ff;
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="login-card">
        <div class="brand-mark" aria-hidden="true">S</div>
        <h1>Welcome back</h1>
        <p class="subtitle">Log in with your email and password to continue.</p>

        <form id="loginForm" novalidate>
            <label for="email">Email address</label>
            <input
                type="email"
                id="email"
                name="email"
                autocomplete="email"
                placeholder="you@example.com"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                placeholder="Enter your password"
                required
            >

            <button id="submitButton" type="submit">Log in</button>
            <p class="message" id="message" role="status" aria-live="polite"></p>
        </form>

        <p class="signup-prompt">New here?</p>
        <a class="signup-link" href="/">Create an account</a>
    </main>

    <script>
        const form = document.getElementById("loginForm");
        const message = document.getElementById("message");
        const submitButton = document.getElementById("submitButton");
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            message.textContent = "";
            message.classList.remove("success");

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            if (!email || !password) {
                message.textContent = "Please enter both your email and password.";
                return;
            }

            if (!emailPattern.test(email)) {
                message.textContent = "Please enter a valid email address.";
                return;
            }

            const credentials = { email, password };
            submitButton.disabled = true;
            submitButton.textContent = "Logging in...";

            try {
                const response = await fetch("/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(credentials)
                });
                const result = await response.json();

                if (!response.ok) {
                    message.textContent = result.message || "Unable to log in. Please try again.";
                    return;
                }

                message.textContent = result.message || "User login successful";
                message.classList.add("success");
                form.reset();
            } catch (error) {
                message.textContent = "Unable to connect to the server. Please try again.";
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = "Log in";
            }
        });
    </script>
</body>
</html>
